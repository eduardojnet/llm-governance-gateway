<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect width="1200" height="628" fill="#fbfbfa"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5c5c5c"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- perimetro da organizacao -->
  <rect x="38" y="96" width="892" height="472" rx="10" fill="none" stroke="#b3b3b3" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="56" y="86" font-size="14" fill="#8a8a8a" letter-spacing="0.4">perímetro da organização</text>

  <!-- ===== Time de produto (pessoa) ===== -->
  <rect x="80" y="150" width="252" height="88" rx="8" fill="#08427b"/>
  <circle cx="102" cy="172" r="7" fill="#ffffff" opacity="0.85"/>
  <path d="M 93 190 a 9 9 0 0 1 18 0 z" fill="#ffffff" opacity="0.85"/>
  <text x="124" y="178" font-size="18" font-weight="700" fill="#ffffff">Time de produto</text>
  <text x="100" y="212" font-size="13" fill="#ffffff" opacity="0.88">constrói funcionalidades</text>
  <text x="100" y="229" font-size="13" fill="#ffffff" opacity="0.88">que usam LLM</text>

  <!-- ===== Aplicacoes internas ===== -->
  <rect x="80" y="290" width="252" height="88" rx="8" fill="#1168bd"/>
  <text x="100" y="322" font-size="18" font-weight="700" fill="#ffffff">Aplicações internas</text>
  <text x="100" y="346" font-size="13" fill="#ffffff" opacity="0.88">atendimento, back-office,</text>
  <text x="100" y="363" font-size="13" fill="#ffffff" opacity="0.88">análise documental</text>

  <!-- ===== Gateway (foco) ===== -->
  <rect x="404" y="262" width="312" height="126" rx="10" fill="#d94801"/>
  <text x="560" y="304" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">LLM Governance Gateway</text>
  <text x="560" y="333" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.92">aplica política, mascara PII,</text>
  <text x="560" y="353" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.92">registra e roteia</text>
  <text x="560" y="375" font-size="12" fill="#ffffff" text-anchor="middle" opacity="0.72" letter-spacing="1">ESTE PROJETO</text>

  <!-- ===== Provedores de LLM (externo, fora do perimetro) ===== -->
  <rect x="982" y="280" width="182" height="90" rx="8" fill="#999999"/>
  <text x="1073" y="314" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Provedores</text>
  <text x="1073" y="335" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">de LLM</text>
  <text x="1073" y="357" font-size="12.5" fill="#ffffff" text-anchor="middle" opacity="0.9">fora do perímetro</text>

  <!-- ===== Tres publicos assincronos ===== -->
  <rect x="150" y="452" width="200" height="86" rx="8" fill="#08427b"/>
  <circle cx="172" cy="474" r="7" fill="#ffffff" opacity="0.85"/>
  <path d="M 163 492 a 9 9 0 0 1 18 0 z" fill="#ffffff" opacity="0.85"/>
  <text x="194" y="480" font-size="17" font-weight="700" fill="#ffffff">Auditoria e DPO</text>
  <text x="170" y="514" font-size="13" fill="#ffffff" opacity="0.88">quem viu o quê,</text>
  <text x="170" y="531" font-size="13" fill="#ffffff" opacity="0.88">quando e sob qual regra</text>

  <rect x="392" y="452" width="200" height="86" rx="8" fill="#08427b"/>
  <circle cx="414" cy="474" r="7" fill="#ffffff" opacity="0.85"/>
  <path d="M 405 492 a 9 9 0 0 1 18 0 z" fill="#ffffff" opacity="0.85"/>
  <text x="436" y="480" font-size="17" font-weight="700" fill="#ffffff">FinOps</text>
  <text x="412" y="514" font-size="13" fill="#ffffff" opacity="0.88">teto de gasto e rateio</text>
  <text x="412" y="531" font-size="13" fill="#ffffff" opacity="0.88">por centro de custo</text>

  <rect x="634" y="452" width="200" height="86" rx="8" fill="#08427b"/>
  <circle cx="656" cy="474" r="7" fill="#ffffff" opacity="0.85"/>
  <path d="M 647 492 a 9 9 0 0 1 18 0 z" fill="#ffffff" opacity="0.85"/>
  <text x="678" y="480" font-size="17" font-weight="700" fill="#ffffff">SRE</text>
  <text x="654" y="514" font-size="13" fill="#ffffff" opacity="0.88">falha externa não vira</text>
  <text x="654" y="531" font-size="13" fill="#ffffff" opacity="0.88">incidente interno</text>

  <!-- ===== Setas solidas: caminho da requisicao ===== -->
  <line x1="206" y1="238" x2="206" y2="288" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="332" y1="332" x2="400" y2="326" stroke="#5c5c5c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="366" y="312" font-size="12.5" fill="#5c5c5c" text-anchor="middle">requisição</text>

  <line x1="716" y1="325" x2="978" y2="325" stroke="#5c5c5c" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="762" y="284" width="172" height="30" rx="5" fill="#fbfbfa" stroke="#d94801" stroke-width="1.2"/>
  <text x="848" y="305" font-size="15" font-weight="700" fill="#d94801" text-anchor="middle">CPF ***.***.***-**</text>

  <!-- ===== Setas tracejadas: consumo assincrono ===== -->
  <line x1="480" y1="390" x2="280" y2="448" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="352" y="408" font-size="12.5" fill="#8a8a8a" text-anchor="middle">trilha</text>

  <line x1="545" y1="390" x2="505" y2="448" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="556" y="424" font-size="12.5" fill="#8a8a8a" text-anchor="middle">custo</text>

  <line x1="635" y1="390" x2="720" y2="448" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowDash)"/>
  <text x="700" y="415" font-size="12.5" fill="#8a8a8a" text-anchor="middle">alerta</text>

  <!-- ===== Legenda ===== -->
  <line x1="56" y1="600" x2="96" y2="600" stroke="#5c5c5c" stroke-width="2"/>
  <text x="104" y="605" font-size="13" fill="#6b6b6b">caminho da requisição</text>
  <line x1="272" y1="600" x2="312" y2="600" stroke="#8a8a8a" stroke-width="1.8" stroke-dasharray="6 5"/>
  <text x="320" y="605" font-size="13" fill="#6b6b6b">consumo assíncrono</text>
  <text x="1164" y="605" font-size="13" fill="#9a9a9a" text-anchor="end">C4 nível 1 · contexto</text>

</svg>
